version: '3.8'
services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/instance
    networks:
      - dns_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  sqlite_data:
networks:
  dns_net:
    driver: bridge
