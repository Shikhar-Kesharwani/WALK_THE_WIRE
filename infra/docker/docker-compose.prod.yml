version: '3.8'

services:
  frontend:
    build:
      context: ../../
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ../../
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    env_file:
      - ../../.env
    environment:
      - FLASK_ENV=production
    restart: always
