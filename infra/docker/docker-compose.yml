version: '3.8'

services:
  frontend:
    build:
      context: ../../
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: ../../
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    env_file:
      - ../../.env
    volumes:
      - ../../src:/app/src
    environment:
      - FLASK_ENV=development
