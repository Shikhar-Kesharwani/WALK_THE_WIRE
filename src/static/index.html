<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Resolver</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-box">
                <span class="pulse"></span>
                <h1>DNS Resolver</h1>
            </div>
            <p>A ground-up implementation using raw UDP sockets</p>
        </header>

        <main>
            <div class="search-container">
                <form id="resolve-form">
                    <input type="text" id="domain-input" placeholder="e.g., github.com" autocomplete="off" required>
                    <button type="submit" id="resolve-btn">
                        <span>Resolve</span>
                        <div class="loader hidden" id="btn-loader"></div>
                    </button>
                </form>
            </div>

            <div class="results-container hidden" id="results-container">
                <div class="summary-card" id="summary-card">
                    <div class="summary-header">
                        <h2>Result</h2>
                        <span class="badge" id="time-badge">0.000s</span>
                    </div>
                    <div class="ip-display" id="ip-display">
                        --
                    </div>
                </div>

                <div class="terminal-card">
                    <div class="terminal-header">
                        <div class="dots">
                            <span class="dot red"></span>
                            <span class="dot yellow"></span>
                            <span class="dot green"></span>
                        </div>
                        <span class="terminal-title">Resolution Trace</span>
                    </div>
                    <div class="terminal-body" id="terminal-body">
                        <!-- Hops will be injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
